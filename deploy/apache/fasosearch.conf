<VirtualHost *:80>
    ServerName fasosearch.golden-technologies.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8100/
    ProxyPassReverse / http://127.0.0.1:8100/
    ErrorLog ${APACHE_LOG_DIR}/fasosearch-error.log
    CustomLog ${APACHE_LOG_DIR}/fasosearch-access.log combined
</VirtualHost>
