services:
  fasosearch:
    image: ghcr.io/abdazz/fasosearch:${IMAGE_TAG:-latest}
    container_name: fasosearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    mem_limit: 2g
    cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
